<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>11206 Load Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: phone-first single column; sticky header; cards per student; brick-red accent for the load test. */
:root{
  --bg:#f3f1ec; --panel:#ffffff; --ink:#1c1a17; --muted:#6b655c; --line:#d9d4ca;
  --accent:#b2452b; --accent-ink:#ffffff; --good:#2f7a4f; --bad:#a63a2e; --soft:#ede7dc;
  --display:"Barlow Semi Condensed","Arial Narrow",sans-serif; --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17160f; --panel:#221f1a; --ink:#f0ebe2; --muted:#a39b8e; --line:#3b362e;
  --accent:#d8603f; --accent-ink:#1a110d; --good:#6cc08f; --bad:#e37c6a; --soft:#2c2822; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17160f; --panel:#221f1a; --ink:#f0ebe2; --muted:#a39b8e; --line:#3b362e;
  --accent:#d8603f; --accent-ink:#1a110d; --good:#6cc08f; --bad:#e37c6a; --soft:#2c2822; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body{padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
.hdr{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg);
  padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px}
.hdr .back{font-size:22px;line-height:1;padding:4px 8px;margin-left:-8px;border-radius:6px}
.hdr .title{flex:1;min-width:0}
.hdr .title h1{font-size:22px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .title small{display:block;font-size:12px;opacity:.75;letter-spacing:.06em;text-transform:uppercase}
.hdr .act{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:8px 12px;border-radius:6px;font-size:14px}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11px;opacity:.8;letter-spacing:.04em;text-transform:none}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok::before{background:var(--good)} .sync.busy::before{background:#e0a92b} .sync.off::before{background:var(--bad)}
.field input[type=text],.field input[type=password]{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
main{padding:16px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
.notice{background:var(--soft);border-left:4px solid var(--accent);padding:10px 12px;border-radius:4px;font-size:14px;margin-bottom:16px}
.notice.err{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.tile:active{background:var(--soft)}
.tile .n{font-family:var(--display);font-size:22px;font-weight:700}
.tile .p{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .bar{height:4px;background:var(--soft);border-radius:2px;overflow:hidden}
.tile .bar i{display:block;height:100%;background:var(--accent)}
.tile.wide{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tile.wide .p{color:inherit;opacity:.75}
.sec{margin:22px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--body);font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;display:grid;gap:12px}
.card.done{background:color-mix(in srgb,var(--good) 12%,var(--panel));border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
@supports not (background:color-mix(in srgb,red 10%,white)){ .card.done{background:#e9f4ec;border-color:#9ccfae} :root[data-theme="dark"] .card.done{background:#1f2e24} }
.card .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .name h3{font-size:20px}
.card .name .idx{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:600}
.field input[type=number]{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.field input[type=number]:focus{outline:2px solid var(--accent);outline-offset:1px}
.slider{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.slider output{font-family:var(--display);font-size:26px;font-weight:700;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.slider output.unset{color:var(--muted);font-size:14px;font-family:var(--body);font-weight:400}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:10px 4px;font-weight:600;font-size:15px;background:var(--bg)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on.yes{background:var(--good);color:#fff}
.seg button.on.no{background:var(--bad);color:#fff}
.seg button:focus-visible,.tile:focus-visible,.act:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.picker{position:sticky;top:var(--hdr,58px);z-index:4;background:var(--bg);padding:8px 0 10px;margin:-8px 0 12px;display:grid;gap:8px}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:8px;position:relative}
.searchwrap{position:relative;min-width:0}
.searchwrap input[type=search]{width:100%;padding:11px 36px 11px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:17px;-webkit-appearance:none}
.searchwrap input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px}
.searchwrap input[type=search]::-webkit-search-cancel-button{display:none}
.searchwrap .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:20px;line-height:1;padding:6px 8px;color:var(--muted)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:min(52vh,360px);overflow-y:auto;z-index:6}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 12px;font-size:16px;border-bottom:1px solid var(--line)}
.dd button:last-child{border-bottom:0}
.dd button:active,.dd button.hl{background:var(--soft)}
.dd .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dd .dot.done{background:var(--good)}
.dd .ln{color:var(--muted)}
.addbtn{border:1px solid var(--line);border-radius:6px;background:var(--panel);font-weight:600;font-size:15px;padding:0 14px;white-space:nowrap}
.picker .meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.picker .meta button{color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
th.sortable{cursor:pointer;user-select:none;-webkit-user-select:none}
th.sortable.on{color:var(--accent)}
th.sortable::after{content:" ↕";opacity:.4}
th.sortable.on.asc::after{content:" ↑";opacity:1}
th.sortable.on.desc::after{content:" ↓";opacity:1}
.tscroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-bottom:16px}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:16px}
.chart h3{font-size:16px;margin-bottom:8px}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:76px 1fr 56px;align-items:center;gap:8px;font-size:14px}
.bar-row .b{height:18px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar-row .b i{display:block;height:100%;background:var(--accent)}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:var(--panel);padding:10px 14px;border-radius:6px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.hidden-input{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.confirm{display:grid;gap:8px;background:var(--soft);padding:12px;border-radius:6px;margin-bottom:16px}
@media (prefers-reduced-motion: reduce){ .toast{transition:none} }
</style>
</head>
<body>
<header class="hdr" id="hdr"></header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="rosterFile" class="hidden-input" accept=".xlsx,.xls,.csv">
<input type="file" id="importFile" class="hidden-input" accept=".xlsx" multiple>

<script>
(function(){
const TUTORIALS=["Lucy","Herman","Kamyar","Vanessa","Annabel","Aman","Daniel","Mitchell","Fernando","Michelle","Sarah"];
const ROSTER_URL="students.xlsx";
const KEY_RESULTS="ics11206.results.v1", KEY_ROSTER="ics11206.roster.v1", KEY_EXTRA="ics11206.extra.v1";

let roster=[];      // {id, first, last, tutor} from students.xlsx
let extra=[];       // {id, first, last, tutor} added from a tutorial page (shared via the API)
let results={};     // id -> {w, c, b1, f2, ts}
let rosterError="";
let unmatched=0;

const $=s=>document.querySelector(s);
const hdr=$("#hdr"), main=$("#main");

/* ---------- storage ---------- */
function load(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
results=load(KEY_RESULTS,{});
roster=load(KEY_ROSTER,[]);
extra=load(KEY_EXTRA,[]);

/* ---------- roster ---------- */
function norm(s){ return String(s==null?"":s).trim(); }
function makeId(first,last,tutor){ return (tutor+"|"+first+"|"+last).toLowerCase().replace(/\s+/g," "); }
function parseRosterWorkbook(wb){
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
  if(!rows.length) throw new Error("The spreadsheet is empty.");
  let ci={first:0,last:1,tutor:2};
  const head=rows[0].map(h=>String(h).toLowerCase());
  const fi=head.findIndex(h=>h.includes("first")), li=head.findIndex(h=>h.includes("last")||h.includes("surname")), ti=head.findIndex(h=>h.includes("tutor"));
  let start=0;
  if(fi>=0&&li>=0&&ti>=0){ ci={first:fi,last:li,tutor:ti}; start=1; }
  else if(head.some(h=>/first|last|tutor|name/.test(h))) start=1;
  const tmap=new Map(TUTORIALS.map(t=>[t.toLowerCase(),t]));
  const out=[]; unmatched=0;
  for(let r=start;r<rows.length;r++){
    const first=norm(rows[r][ci.first]), last=norm(rows[r][ci.last]), traw=norm(rows[r][ci.tutor]);
    if(!first&&!last) continue;
    const tutor=tmap.get(traw.toLowerCase());
    if(!tutor){ unmatched++; continue; }
    out.push({id:makeId(first,last,tutor),first,last,tutor});
  }
  if(!out.length) throw new Error("No rows matched. Check the tutor column uses the tutor names exactly.");
  return out;
}
async function fetchRoster(){
  try{
    const res=await fetch(ROSTER_URL+"?v="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const buf=await res.arrayBuffer();
    const wb=XLSX.read(buf,{type:"array"});
    roster=parseRosterWorkbook(wb); save(KEY_ROSTER,roster); rosterError="";
  }catch(e){
    rosterError = roster.length ? "" : "Could not load students.xlsx ("+e.message+"). Upload it below or put it next to index.html.";
  }
  render();
}
$("#rosterFile").addEventListener("change",async ev=>{
  const f=ev.target.files[0]; if(!f) return;
  try{ const wb=XLSX.read(await f.arrayBuffer(),{type:"array"}); roster=parseRosterWorkbook(wb); save(KEY_ROSTER,roster); rosterError=""; toast("Roster loaded: "+roster.length+" students"); }
  catch(e){ rosterError="Could not read that file: "+e.message; }
  ev.target.value=""; render();
});

/* ---------- results ---------- */
function get(id){ return results[id]||{}; }
function set(id,patch){ results[id]=Object.assign({},get(id),patch,{ts:Date.now()}); save(KEY_RESULTS,results); queuePush(id); }

/* ---------- live sync (api/results.js + Upstash Redis) ---------- */
const API="api/results", KEY_PENDING="ics11206.pending.v1";
let syncState="busy", syncMsg="connecting", pending=load(KEY_PENDING,{}), pushTimer=null, pollTimer=null, apiAvailable=true;
function setSync(st,msg){ syncState=st; syncMsg=msg; const e=hdr.querySelector(".sync"); if(e){ e.className="sync "+st; e.textContent=msg; } }
function mergeIn(remote){ let changed=false;
  for(const id in remote){ const r=remote[id], cur=get(id); if(!cur.ts||(r&&r.ts>=cur.ts&&!pending[id])){ if(JSON.stringify(cur)!==JSON.stringify(r)){ results[id]=r; changed=true; } } }
  if(changed) save(KEY_RESULTS,results); return changed; }
async function pull(){
  if(!apiAvailable) return;
  try{ const res=await fetch(API,{cache:"no-store"}); if(res.status===404){ apiAvailable=false; setSync("off","no sync (static)"); return; }
    const j=await res.json(); if(!j.ok) throw new Error(j.error||"error");
    // records deleted on the server disappear locally too (unless we still have a pending write)
    for(const id in results){ if(!(id in j.results)&&!pending[id]&&results[id].ts&&results[id].ts<Date.now()-15000){ delete results[id]; } }
    let changed=mergeIn(j.results); save(KEY_RESULTS,results);
    if(Array.isArray(j.extra)){ const next=j.extra.filter(e=>e&&e.id&&TUTORIALS.includes(e.tutor)).concat(extra.filter(e=>e.pending&&!j.extra.find(x=>x.id===e.id))); if(JSON.stringify(next)!==JSON.stringify(extra)){ extra=next; save(KEY_EXTRA,extra); changed=true; } }
    if(!Object.keys(pending).length) setSync("ok","live");
    if(changed&&!document.activeElement.matches("input")) render();
  }catch(e){ setSync("off","offline, saved on phone"); }
}
function queuePush(id){ pending[id]=true; save(KEY_PENDING,pending); setSync("busy","saving"); clearTimeout(pushTimer); pushTimer=setTimeout(flush,500); }
async function flush(){
  if(apiAvailable) flushExtras();
  if(!apiAvailable){ pending={}; save(KEY_PENDING,pending); setSync("off","no sync (static)"); return; }
  const ids=Object.keys(pending); if(!ids.length){ setSync("ok","live"); return; }
  const records={}; ids.forEach(id=>records[id]=get(id));
  try{ const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({records})});
    const j=await res.json(); if(!res.ok||!j.ok) throw new Error(j.error||"save failed");
    ids.forEach(id=>delete pending[id]); save(KEY_PENDING,pending); setSync("ok","live");
  }catch(e){ setSync("off","offline, will retry"); setTimeout(flush,5000); }
}
function startPolling(){ clearInterval(pollTimer); const r=route(); const every=r.page==="compare"?8000:30000; pollTimer=setInterval(()=>{ if(document.visibilityState==="visible") pull(); },every); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ pull(); flush(); } });
window.addEventListener("online",()=>{ pull(); flush(); });
async function addStudent(first,last,tutor){
  first=norm(first); last=norm(last);
  if(!first&&!last) { toast("Enter a name"); return false; }
  const id=makeId(first,last,tutor);
  if(allStudents().find(s=>s.id===id)){ toast("That name is already listed"); view.sel=id; return true; }
  extra.push({id,first,last,tutor,pending:true}); save(KEY_EXTRA,extra); view.sel=id;
  if(apiAvailable){
    if(await pushExtra(id)) toast("Added "+(first+" "+last).trim()+" to "+tutor);
    else toast("Added on this phone; will sync when the server is reachable");
  } else toast("Added "+(first+" "+last).trim());
  return true;
}
async function pushExtra(id){
  const e=extra.find(x=>x.id===id); if(!e) return false;
  try{ const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({addStudent:{first:e.first,last:e.last,tutor:e.tutor}})});
    const j=await res.json(); if(!res.ok||!j.ok) throw new Error(j.error||"failed");
    delete e.pending; save(KEY_EXTRA,extra); return true;
  }catch(err){ return false; }
}
async function flushExtras(){ for(const e of extra.filter(x=>x.pending)) await pushExtra(e.id); }
async function removeStudent(id){
  extra=extra.filter(e=>e.id!==id); delete results[id]; delete pending[id]; save(KEY_EXTRA,extra); save(KEY_RESULTS,results); save(KEY_PENDING,pending);
  if(view.sel===id) view.sel=null;
  if(apiAvailable){ try{ await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({removeStudent:id})}); }catch(e){} }
  toast("Removed"); render();
}
async function resetShared(key){
  try{ const res=await fetch(API,{method:"DELETE",headers:{"x-admin-key":key}}); const j=await res.json(); if(!res.ok||!j.ok) throw new Error(j.error||"refused");
    results={}; pending={}; save(KEY_RESULTS,results); save(KEY_PENDING,pending); toast("Shared data reset"); render(); }
  catch(e){ toast("Reset refused: "+e.message); }
}
function isLogged(r){ return r&&(r.w!=null||r.c!=null||r.b1!=null||r.f2!=null); } // has any data (storage)
function isDone(r){ return !!r&&r.w!=null&&!isNaN(r.w)&&r.c!=null; }                 // counts as logged: weight AND creativity
function studentsOf(t){ return roster.concat(extra.filter(e=>!roster.find(s=>s.id===e.id))).filter(s=>s.tutor===t); }
function allStudents(){ return roster.concat(extra.filter(e=>!roster.find(s=>s.id===e.id))); }
function fmt(n,d){ return n==null||isNaN(n)?"–":Number(n).toFixed(d==null?0:d); }
function summary(t){
  const ss=studentsOf(t), rs=ss.map(s=>get(s.id));
  const logged=rs.filter(isDone);
  const ws=rs.map(r=>r.w).filter(v=>v!=null&&!isNaN(v));
  const cs=rs.map(r=>r.c).filter(v=>v!=null);
  const b1=rs.filter(r=>r.b1!=null), f2=rs.filter(r=>r.f2!=null);
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  return {tutor:t,n:ss.length,logged:logged.length,avgW:avg(ws),minW:ws.length?Math.min(...ws):null,maxW:ws.length?Math.max(...ws):null,
    avgC:avg(cs),pB1:b1.length?100*b1.filter(r=>r.b1===true).length/b1.length:null,pF2:f2.length?100*f2.filter(r=>r.f2===true).length/f2.length:null,
    nB1:b1.filter(r=>r.b1===true).length,nF2:f2.filter(r=>r.f2===true).length};
}

/* ---------- export / import ---------- */
function exportXlsx(){
  const rows=[["Tutorial","First name","Last name","Weight (g)","Creativity (0-10)","Carried 1 brick","Failed under 2 bricks","Last updated"]];
  TUTORIALS.forEach(t=>studentsOf(t).forEach(s=>{ const r=get(s.id);
    rows.push([t,s.first,s.last,r.w??"",r.c??"",r.b1==null?"":(r.b1?"Yes":"No"),r.f2==null?"":(r.f2?"Yes":"No"),r.ts?new Date(r.ts).toLocaleString():""]); }));
  const sum=[["Tutorial","Students","Logged","Avg weight (g)","Min weight (g)","Max weight (g)","Avg creativity","Carried 1 brick (%)","Failed under 2 (%)"]];
  TUTORIALS.forEach(t=>{ const m=summary(t); sum.push([t,m.n,m.logged,r1(m.avgW),m.minW??"",m.maxW??"",r1(m.avgC),r1(m.pB1),r1(m.pF2)]); });
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),"Results");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),"Summary");

$("#importFile").addEventListener("change",async ev=>{
  let merged=0, files=[...ev.target.files]; const imported={};
  for(const f of files){
    try{
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
      const ws=wb.Sheets["Results"]||wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      for(let i=1;i<rows.length;i++){
        const [t,first,last,w,c,b1,f2,upd]=rows[i];
        if(!t) continue;
        const id=makeId(norm(first),norm(last),norm(t));
        const inc={w:w===""?null:Number(w),c:c===""?null:Number(c),b1:b1===""?null:String(b1).toLowerCase()==="yes",f2:f2===""?null:String(f2).toLowerCase()==="yes"};
        if(!isLogged(inc)) continue;
        const ts=upd?Date.parse(upd)||Date.now():Date.now();
        const cur=get(id);
        if(!cur.ts||ts>=cur.ts){ results[id]=Object.assign(inc,{ts}); imported[id]=results[id]; merged++; }
        if(!allStudents().find(s=>s.id===id)&&TUTORIALS.includes(t)){ extra.push({id,first:norm(first),last:norm(last),tutor:t}); }
      }
    }catch(e){ toast("Could not read "+f.name); }
  }
  save(KEY_RESULTS,results); save(KEY_ROSTER,roster);
  ev.target.value="";
  if(!merged){ toast("Nothing to import"); render(); return; }
  if(apiAvailable){
    setSync("busy","importing");
    try{ const res=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":importKey},body:JSON.stringify({records:imported,import:true})});
      const j=await res.json(); if(!res.ok||!j.ok) throw new Error(j.error||"refused");
      toast("Imported "+merged+" records and synced to everyone"); setSync("ok","live");
    }catch(e){ toast("Import refused: "+e.message); setSync("ok","live"); pull(); }
  } else toast("Merged "+merged+" records on this phone");
  importKey=""; render();
});

function sortableTable(rows,cols,init){
  // cols: [{key,label,get(row)->value for sort,text(row),num:true,left:true}]
  let sortKey=init.key, dir=init.dir;
  const wrap=el("div",{class:"tscroll"});
  function cmp(a,b){ const c=cols.find(x=>x.key===sortKey); let va=c.get(a), vb=c.get(b);
    const na=va==null||va==="", nb=vb==null||vb===""; if(na&&nb) return 0; if(na) return 1; if(nb) return -1;
    let r = typeof va==="number"&&typeof vb==="number" ? va-vb : (typeof va==="boolean"&&typeof vb==="boolean" ? (va===vb?0:(va?-1:1)) : String(va).localeCompare(String(vb)));
    return dir==="asc"?r:-r; }
  function draw(){
    const list=rows.slice().sort(cmp);
    const t=el("table",{},[el("thead",{},[el("tr",{},[el("th",{text:"#"})].concat(cols.map(c=>el("th",{class:"sortable"+(c.key===sortKey?" on "+dir:""),style:c.left?"text-align:left":"",onclick:()=>{ if(sortKey===c.key) dir=dir==="asc"?"desc":"asc"; else { sortKey=c.key; dir=c.defaultDir||"asc"; } draw(); }},[c.label]))))]),
      el("tbody",{},list.map((r,i)=>el("tr",{},[el("td",{text:String(i+1),style:"color:var(--muted)"})].concat(cols.map(c=>el("td",{text:c.text(r),style:c.left?"text-align:left;white-space:normal":""}))))))]);
    wrap.replaceChildren(t);
  }
  draw(); return wrap;
}
